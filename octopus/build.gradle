plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
    id 'com.google.devtools.ksp' version '2.0.20-1.0.25'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.koupper'

application {
    mainClass = 'com.koupper.octopus.OctopusBootstrapKt'
}

repositories {
    mavenCentral()
}

tasks.named('jar', Jar) {
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.koupper.octopus.OctopusBootstrapKt'
        attributes 'Implementation-Title': 'Koupper Octopus'
        attributes 'Implementation-Version': project.version
    }

    from sourceSets.main.output
    from({
        configurations.runtimeClasspath.getFiles()
            .findAll { it?.exists() }
            .collect { it.isDirectory() ? it : zipTree(it) }
    })

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyFatJar') {
    dependsOn fatJar
    doLast {
        println "🔍 Verificando contenido del JAR..."
        def jarFile = tasks.fatJar.archiveFile.get().asFile
        def process = "jar tf ${jarFile}".execute()
        def foundServices = false
        process.inputStream.eachLine { line ->
            if (line.contains("META-INF/services")) {
                println "   ✅ $line"
                foundServices = true
            }
        }
        if (foundServices) {
            println "🎉 Archivos de servicio encontrados!"
        } else {
            println "⚠️ No se encontraron archivos de servicio META-INF/services"
        }
    }
}

tasks.register('optimized', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest {
        attributes 'Main-Class': 'com.koupper.octopus.OctopusBootstrapKt'
        attributes 'Implementation-Title': 'Koupper Octopus'
        attributes 'Implementation-Version': project.version
    }

    from sourceSets.main.output
    from({
        // Match only Koupper's own modules: name must be exactly <module>-<version>.jar
        // to avoid false positives like jersey-container-* or jackson-annotations-*
        def koupperModules = ['container', 'providers', 'configurations', 'shared', 'os', 'annotations', 'orchestrator-core', 'logging']
        def filtered = configurations.runtimeClasspath.getFiles().findAll { f ->
            f?.exists() && koupperModules.any { m -> f.name.matches("${m}-[0-9].*\\.jar") }
        }
        filtered.each { println "Octopus dependency Included: ${it.name}" }
        filtered.collect { it.isDirectory() ? it : zipTree(it) }
    })

    archiveBaseName = 'octopus'
    archiveVersion = project.version.toString()

    doLast { println 'Octopus generated.' }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

tasks.named('shadowJar', ShadowJar) {
    archiveBaseName = 'octopus'
    archiveVersion = project.version.toString()
    zip64 = true

    mergeServiceFiles()
    exclude "META-INF/maven/**"
    exclude "module-info.class"
    exclude "META-INF/versions/*/module-info.class"

    manifest {
        attributes 'Main-Class': 'com.koupper.octopus.OctopusBootstrapKt'
        attributes 'Implementation-Title': 'Koupper Octopus'
        attributes 'Implementation-Version': project.version
    }

    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]

    doLast {
        println "✅ JAR generado con Shadow: ${archiveFile.get()}"
        println "📦 Tamaño: ${archiveFile.get().asFile.length() / (1024 * 1024)} MB"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'octopus'
            version = project.version
            artifact tasks.named('optimized')
        }
    }

    repositories {
        mavenLocal()
    }
}

dependencies {
    ksp project(':annotation-processor')
}

tasks.withType(Test) {
    forkEvery = 1
}

